<!DOCTYPE html>
<html lang="en">
<head>
    <title>Diabetes Assessment Wizard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .step { display: none; }
        .step.active { display: block; animation: fadeIn 0.5s; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .form-group { margin-bottom: 20px; }
        label { font-weight: 600; color: #555; display: block; margin-bottom: 8px; }
        input { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        .btn-container { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn-next { background: #007bff; color: white; }
        .btn-back { background: #6c757d; color: white; }
        .btn-submit { background: #28a745; color: white; width: 100%; }
        .review-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .review-table th, .review-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .review-table th { color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>🩸 Diabetes Risk Assessment</h2>
        <p style="text-align: center; color: #666;">Step <span id="step-number">1</span> of 5</p>

        <form id="wizard-form" action="/predict_diabetes" method="POST">
            
            <div class="step active" id="step1">
                <div class="form-group">
                    <label>1. Pregnancies (Number of times pregnant)</label>
                    <input type="number" name="Pregnancies" required placeholder="e.g., 0, 1, 2...">
                </div>
                <div class="form-group">
                    <label>2. Age (years)</label>
                    <input type="number" name="Age" required placeholder="e.g., 45">
                </div>
                <div class="btn-container" style="justify-content: flex-end;">
                    <button type="button" class="btn btn-next" onclick="nextStep(2)">Next →</button>
                </div>
            </div>

            <div class="step" id="step2">
                <div class="form-group">
                    <label>3. Glucose Level (mg/dL)</label>
                    <input type="number" name="Glucose" required placeholder="e.g., 120">
                </div>
                <div class="form-group">
                    <label>4. Blood Pressure (mm Hg)</label>
                    <input type="number" name="BloodPressure" required placeholder="e.g., 70">
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(1)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="nextStep(3)">Next →</button>
                </div>
            </div>

            <div class="step" id="step3">
                <div class="form-group">
                    <label>5. Skin Thickness (mm)</label>
                    <input type="number" name="SkinThickness" required placeholder="e.g., 20">
                </div>
                <div class="form-group">
                    <label>6. Insulin Level (mu U/ml)</label>
                    <input type="number" name="Insulin" required placeholder="e.g., 79">
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(2)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="nextStep(4)">Next →</button>
                </div>
            </div>

            <div class="step" id="step4">
                <div class="form-group">
                    <label>7. BMI (Body Mass Index)</label>
                    <input type="number" step="0.1" name="BMI" required placeholder="e.g., 33.6">
                </div>
                <div class="form-group">
                    <label>8. Diabetes Pedigree Function</label>
                    <input type="number" step="0.001" name="DiabetesPedigreeFunction" required placeholder="e.g., 0.627">
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(3)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="showReview()">Review Data →</button>
                </div>
            </div>

            <div class="step" id="step-review">
                <h3>🔍 Review Your Details</h3>
                <table class="review-table" id="review-table-body"></table>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(4)">← Edit Data</button>
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-submit">Confirm & Assess Risk</button>
                </div>
            </div>

        </form>
    </div>

    <script>
        let currentStep = 1;
        function showStep(step) {
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            document.getElementById('step' + step).classList.add('active');
            document.getElementById('step-number').textContent = step;
            currentStep = step;
        }
        function nextStep(step) {
            const currentDiv = document.getElementById('step' + currentStep);
            const inputs = currentDiv.querySelectorAll('input');
            for (let input of inputs) { if (!input.checkValidity()) { input.reportValidity(); return; } }
            showStep(step);
        }
        function prevStep(step) {
            if (currentStep === 'review') {
                 document.getElementById('step-review').classList.remove('active');
                 document.getElementById('step4').classList.add('active');
                 document.getElementById('step-number').textContent = 4;
                 currentStep = 4;
            } else { showStep(step); }
        }
        function showReview() {
            const reviewBody = document.getElementById('review-table-body');
            reviewBody.innerHTML = '';
            const formData = new FormData(document.getElementById('wizard-form'));
            for (let [key, value] of formData.entries()) {
                reviewBody.innerHTML += `<tr><th>${key}</th><td>${value}</td></tr>`;
            }
            document.getElementById('step4').classList.remove('active');
            document.getElementById('step-review').classList.add('active');
            document.getElementById('step-number').textContent = 'Review';
            currentStep = 'review';
        }
    </script>
</body>
</html>
