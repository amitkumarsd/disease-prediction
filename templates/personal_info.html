<!DOCTYPE html>
<html lang="en">
<head>
    <title>Patient Information</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 40px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 25px; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 16px; }
        .btn { width: 100%; padding: 12px; background: #007bff; color: white; border: none; border-radius: 6px; font-size: 18px; cursor: pointer; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
    <div class="container">
        <h2>👤 Patient Details</h2>
        <p style="text-align: center; color: #666;">Please enter your details before proceeding.</p>
        
        <form action="/save_personal_info" method="POST">
            <input type="hidden" name="target_disease" value="{{ target }}">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="full_name" required placeholder="John Doe">
            </div>

            <div class="form-group">
                <label>Age</label>
                <input type="number" name="age" required placeholder="e.g., 45">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender" required>
                    <option value="">Select Gender</option>
                    <option value="Male">Male</option>
                    <option value="Female">Female</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Contact Number (Optional)</label>
                <input type="tel" name="contact">
            </div>

            <button type="submit" class="btn">Continue to Assessment →</button>
        </form>
    </div>
</body>
</html>
