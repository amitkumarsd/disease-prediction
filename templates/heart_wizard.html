<!DOCTYPE html>
<html lang="en">
<head>
    <title>Heart Disease Assessment Wizard</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f4f7f6; padding: 20px; }
        .container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: #333; margin-bottom: 20px; }
        .step { display: none; } /* All steps hidden by default */
        .step.active { display: block; animation: fadeIn 0.5s; } /* Only active step shown */
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        
        .form-group { margin-bottom: 20px; }
        label { font-weight: 600; color: #555; display: block; margin-bottom: 8px; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; font-size: 16px; box-sizing: border-box; }
        
        .btn-container { display: flex; justify-content: space-between; margin-top: 30px; }
        .btn { padding: 12px 24px; border: none; border-radius: 6px; font-size: 16px; cursor: pointer; }
        .btn-next { background: #007bff; color: white; }
        .btn-back { background: #6c757d; color: white; }
        .btn-submit { background: #28a745; color: white; width: 100%; }
        
        /* Review Table Styles */
        .review-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .review-table th, .review-table td { padding: 10px; border-bottom: 1px solid #eee; text-align: left; }
        .review-table th { color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <h2>❤️ Heart Health Assessment</h2>
        <p style="text-align: center; color: #666;">Step <span id="step-number">1</span> of 7</p>

        <form id="wizard-form" action="/predict" method="POST">
            
            <div class="step active" id="step1">
                <div class="form-group">
                    <label>1. Age (years)</label>
                    <input type="number" name="age" id="age" required placeholder="e.g., 55">
                </div>
                <div class="form-group">
                    <label>2. Sex</label>
                    <select name="sex" id="sex" required>
                        <option value="1">Male</option>
                        <option value="0">Female</option>
                    </select>
                </div>
                <div class="btn-container" style="justify-content: flex-end;">
                    <button type="button" class="btn btn-next" onclick="nextStep(2)">Next →</button>
                </div>
            </div>

            <div class="step" id="step2">
                <div class="form-group">
                    <label>3. Chest Pain Type (0-3)</label>
                    <select name="cp" id="cp" required>
                        <option value="0">Typical Angina (0)</option>
                        <option value="1">Atypical Angina (1)</option>
                        <option value="2">Non-anginal Pain (2)</option>
                        <option value="3">Asymptomatic (3)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>4. Resting Blood Pressure (mm Hg)</label>
                    <input type="number" name="trestbps" id="trestbps" required placeholder="e.g., 130">
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(1)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="nextStep(3)">Next →</button>
                </div>
            </div>

            <div class="step" id="step3">
                <div class="form-group">
                    <label>5. Serum Cholesterol (mg/dl)</label>
                    <input type="number" name="chol" id="chol" required placeholder="e.g., 250">
                </div>
                <div class="form-group">
                    <label>6. Fasting Blood Sugar > 120 mg/dl?</label>
                    <select name="fbs" id="fbs" required>
                        <option value="0">No (False)</option>
                        <option value="1">Yes (True)</option>
                    </select>
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(2)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="nextStep(4)">Next →</button>
                </div>
            </div>

            <div class="step" id="step4">
                <div class="form-group">
                    <label>7. Resting ECG Results (0-2)</label>
                    <select name="restecg" id="restecg" required>
                        <option value="0">Normal (0)</option>
                        <option value="1">ST-T Wave Abnormality (1)</option>
                        <option value="2">Left Ventricular Hypertrophy (2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>8. Max Heart Rate Achieved</label>
                    <input type="number" name="thalach" id="thalach" required placeholder="e.g., 150">
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(3)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="nextStep(5)">Next →</button>
                </div>
            </div>

            <div class="step" id="step5">
                <div class="form-group">
                    <label>9. Exercise Induced Angina?</label>
                    <select name="exang" id="exang" required>
                        <option value="0">No</option>
                        <option value="1">Yes</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>10. ST Depression (Oldpeak)</label>
                    <input type="number" step="0.1" name="oldpeak" id="oldpeak" required placeholder="e.g., 1.5">
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(4)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="nextStep(6)">Next →</button>
                </div>
            </div>

            <div class="step" id="step6">
                <div class="form-group">
                    <label>11. Slope of Peak Exercise ST (0-2)</label>
                    <select name="slope" id="slope" required>
                        <option value="0">Upsloping (0)</option>
                        <option value="1">Flat (1)</option>
                        <option value="2">Downsloping (2)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>12. Major Vessels Colored by Flourosopy (0-3)</label>
                    <input type="number" name="ca" id="ca" required min="0" max="3" placeholder="0-3">
                </div>
                <div class="form-group">
                    <label>13. Thalassemia (0-3)</label>
                    <select name="thal" id="thal" required>
                        <option value="1">Normal (1)</option>
                        <option value="2">Fixed Defect (2)</option>
                        <option value="3">Reversable Defect (3)</option>
                    </select>
                </div>
                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(5)">← Back</button>
                    <button type="button" class="btn btn-next" onclick="showReview()">Review Data →</button>
                </div>
            </div>

            <div class="step" id="step-review">
                <h3>🔍 Review Your Details</h3>
                <p>Please check your entries before submitting.</p>
                
                <table class="review-table" id="review-table-body">
                    </table>

                <div class="btn-container">
                    <button type="button" class="btn btn-back" onclick="prevStep(6)">← Edit Data</button>
                </div>
                <div style="margin-top: 20px;">
                    <button type="submit" class="btn btn-submit">Confirm & Get Results</button>
                </div>
            </div>

        </form>
    </div>

    <script>
        let currentStep = 1;

        function showStep(step) {
            // Hide all steps
            document.querySelectorAll('.step').forEach(s => s.classList.remove('active'));
            // Show requested step
            document.getElementById('step' + step).classList.add('active');
            // Update progress indicator
            document.getElementById('step-number').textContent = step;
            currentStep = step;
        }

        function nextStep(step) {
            // Simple validation before moving next
            const currentDiv = document.getElementById('step' + currentStep);
            const inputs = currentDiv.querySelectorAll('input, select');
            for (let input of inputs) {
                if (!input.checkValidity()) {
                    input.reportValidity();
                    return;
                }
            }
            showStep(step);
        }

        function prevStep(step) {
            if (step === 6 && currentStep === 'review') {
                 document.getElementById('step-review').classList.remove('active');
                 document.getElementById('step6').classList.add('active');
                 document.getElementById('step-number').textContent = 6;
                 currentStep = 6;
            } else {
                showStep(step);
            }
        }

        function showReview() {
            const reviewBody = document.getElementById('review-table-body');
            reviewBody.innerHTML = ''; // Clear previous content
            
            // Get all inputs from the form
            const formData = new FormData(document.getElementById('wizard-form'));
            
            for (let [key, value] of formData.entries()) {
                // Create a table row for each field
                let row = `<tr>
                    <th>${key.toUpperCase()}</th>
                    <td>${value}</td>
                </tr>`;
                reviewBody.innerHTML += row;
            }

            // Hide step 6, show review step
            document.getElementById('step6').classList.remove('active');
            document.getElementById('step-review').classList.add('active');
            document.getElementById('step-number').textContent = 'Review';
            currentStep = 'review';
        }
    </script>
</body>
</html>
