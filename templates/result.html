<!DOCTYPE html>
<html lang="en">
<head>
    <title>Assessment Results</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f0f2f5; padding: 40px; }
        .container { max-width: 800px; margin: auto; background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #333; }
        .result-card { padding: 25px; border-radius: 8px; text-align: center; margin-bottom: 30px; }
        .high-risk { background: #fff5f5; border: 2px solid #dc3545; color: #dc3545; }
        .low-risk { background: #f5fff5; border: 2px solid #28a745; color: #28a745; }
        .confidence { color: #666; font-size: 0.9em; margin-top: 10px; }
        iframe { width: 100%; height: 200px; border: none; margin-top: 20px; }
        .btn { display: inline-block; padding: 12px 25px; background: #007bff; color: white; text-decoration: none; border-radius: 6px; margin-top: 20px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📋 Assessment Results</h1>

        <div class="result-card {{ result_class }}">
            <h2>{{ prediction_text }}</h2>
            <p class="confidence">AI Confidence: {{ confidence }}</p>
            <hr>
            <h3>Recommendation:</h3>
            <p style="font-size: 1.2em; color: #333;">{{ recommendation }}</p>
        </div>

        <div>
            <h3>🔍 AI Explanation (SHAP Analysis)</h3>
            <p>This chart shows which factors most influenced this specific result.</p>
            <iframe src="{{ shap_plot_url }}"></iframe>
        </div>

        <div style="text-align: center;">
            <a href="/" class="btn">Back to Home Hub</a>
        </div>
    </div>
</body>
</html>
