<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disease Predictor Hub</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; }
        .container { max-width: 1000px; margin: 40px auto; text-align: center; }
        h1 { color: #2c3e50; margin-bottom: 40px; font-size: 3em; }
        .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 25px; padding: 20px; }
        .card { background: white; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); transition: transform 0.3s ease, box-shadow 0.3s ease; text-decoration: none; color: inherit; display: flex; flex-direction: column; align-items: center; }
        .card:hover { transform: translateY(-5px); box-shadow: 0 8px 25px rgba(0,0,0,0.15); }
        .icon { font-size: 60px; margin-bottom: 20px; }
        .card h2 { margin: 0; color: #007bff; }
        .card p { color: #666; margin-top: 10px; }
        .disabled { opacity: 0.6; cursor: not-allowed; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🦠 AI Disease Predictor</h1>
        <p>Select a disease to begin your AI-powered risk assessment.</p>
        
        <div class="grid">
            <a href="/personal_info?next=heart" class="card">
                <div class="icon">❤️</div>
                <h2>Heart Disease</h2>
                <p>Predict risk using 13 clinical features.</p>
            </a>

            <a href="/personal_info?next=diabetes" class="card">
                <div class="icon">🩸</div>
                <h2>Diabetes</h2>
                <p>Assess risk based on glucose, BMI, etc.</p>
            </a>

            <div class="card disabled">
                <div class="icon">🧬</div>
                <h2>Breast Cancer</h2>
                <p>Coming Soon</p>
            </div>
        </div>
    </div>
</body>
</html>
